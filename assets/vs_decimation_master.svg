<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#131924"/>
      <stop offset="100%" stop-color="#0e141f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2433"/>
      <stop offset="100%" stop-color="#141a26"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c3b"/>
      <stop offset="100%" stop-color="#e85d04"/>
    </linearGradient>
    <linearGradient id="grayBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#484f58"/>
      <stop offset="100%" stop-color="#6e7681"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b3438"/>
      <stop offset="100%" stop-color="#c94a4a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1120" height="420" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="560" y="42" text-anchor="middle" fill="#f0f6fc" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="bold">
    KM Decimate 0.4.0  vs  ZBrush 减面大师 (Decimation Master)
  </text>

  <!-- Left Panel: Workflow & Speed Comparison -->
  <g transform="translate(28, 68)" filter="url(#shadow)">
    <rect width="520" height="324" rx="12" fill="url(#card)" stroke="#30363d" stroke-width="1.2"/>
    <rect width="520" height="42" rx="12" fill="#212836"/>
    <path d="M0 30 H520 V42 H0 Z" fill="#212836"/>
    <circle cx="24" cy="21" r="5" fill="#ff7b29"/>
    <text x="40" y="26" fill="#f0f6fc" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15.5" font-weight="bold">
      1. 流程对比（3401 万面带顶点色 → 5%）
    </text>

    <!-- Decimation Master Timeline -->
    <text x="26" y="72" fill="#8b949e" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="bold">
      自带减面大师 — 需两步（每次改模型/遮罩都要重新预处理）
    </text>
    <rect x="26" y="84" width="356" height="34" rx="6" fill="url(#redBar)" stroke="#da5b5b" stroke-width="1"/>
    <text x="204" y="106" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">
      ① Pre-process 预处理（写数 GB 缓存，常需数分钟）
    </text>
    <rect x="390" y="84" width="104" height="34" rx="6" fill="url(#grayBar)" stroke="#8b949e" stroke-width="1"/>
    <text x="442" y="106" text-anchor="middle" fill="#f0f6fc" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">
      ② Decimate
    </text>

    <line x1="26" y1="138" x2="494" y2="138" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- KM Decimate Timeline -->
    <text x="26" y="166" fill="#ff964f" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="bold">
      KM Decimate — 免预处理一键直达（16~24 线程全核并行）
    </text>
    <rect x="26" y="178" width="136" height="36" rx="6" fill="url(#orangeBar)" stroke="#ffb078" stroke-width="1.2"/>
    <text x="94" y="201" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="bold">
      ⚡ 核心 5.10 秒
    </text>
    <rect x="174" y="182" width="102" height="28" rx="14" fill="#172b22" stroke="#2ea043" stroke-width="1"/>
    <text x="225" y="201" text-anchor="middle" fill="#3fb950" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="bold">
      免预处理
    </text>
    <rect x="286" y="182" width="102" height="28" rx="14" fill="#172436" stroke="#388bfd" stroke-width="1"/>
    <text x="337" y="201" text-anchor="middle" fill="#58a6ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="bold">
      零缓存落盘
    </text>
    <rect x="398" y="182" width="96" height="28" rx="14" fill="#2b1d2e" stroke="#a371f7" stroke-width="1"/>
    <text x="446" y="201" text-anchor="middle" fill="#d2a8ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="bold">
      Esc 秒取消
    </text>

    <line x1="26" y1="232" x2="494" y2="232" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Accuracy comparison cards -->
    <text x="26" y="256" fill="#58a6ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">
      同模型同面数几何误差对比（750 万面 → 1%）
    </text>
    <rect x="26" y="266" width="224" height="44" rx="7" fill="#111620" stroke="#2f3747" stroke-width="1"/>
    <text x="138" y="285" text-anchor="middle" fill="#8b949e" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">自带减面大师</text>
    <text x="138" y="303" text-anchor="middle" fill="#e6edf3" font-family="Consolas, monospace" font-size="12.5" font-weight="bold">误差 0.00249%</text>

    <rect x="270" y="266" width="224" height="44" rx="7" fill="#111c19" stroke="#2ea043" stroke-width="1"/>
    <text x="382" y="285" text-anchor="middle" fill="#3fb950" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="bold">KM Decimate (24 线程)</text>
    <text x="382" y="303" text-anchor="middle" fill="#e6edf3" font-family="Consolas, monospace" font-size="12.5" font-weight="bold">误差 0.00251% (几乎一致)</text>
  </g>

  <!-- Right Panel: Clean 3-Column Feature Table -->
  <g transform="translate(572, 68)" filter="url(#shadow)">
    <rect width="520" height="324" rx="12" fill="url(#card)" stroke="#30363d" stroke-width="1.2"/>
    <rect width="520" height="42" rx="12" fill="#212836"/>
    <path d="M0 30 H520 V42 H0 Z" fill="#212836"/>
    <circle cx="24" cy="21" r="5" fill="#2ea043"/>
    <text x="40" y="26" fill="#f0f6fc" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15.5" font-weight="bold">
      2. 核心体验对比
    </text>

    <!-- Table Header -->
    <rect x="18" y="52" width="484" height="30" rx="6" fill="#0d1117"/>
    <text x="32" y="72" fill="#8b949e" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">功能维度</text>
    <text x="176" y="72" fill="#8b949e" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">自带减面大师</text>
    <text x="336" y="72" fill="#ff964f" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">KM Decimate 0.4.0</text>

    <!-- Row 1 -->
    <text x="32" y="108" fill="#e6edf3" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">操作步数</text>
    <text x="176" y="108" fill="#8b949e" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">需先 Pre-process</text>
    <text x="336" y="108" fill="#3fb950" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">一键直达，免预处理</text>
    <line x1="22" y1="120" x2="498" y2="120" stroke="#262c36" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="32" y="146" fill="#e6edf3" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">顶点色细节</text>
    <text x="176" y="146" fill="#8b949e" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">固定权重，瞳孔易糊</text>
    <text x="336" y="146" fill="#3fb950" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">1-10 级滑条 + 颜色锁边</text>
    <line x1="22" y1="158" x2="498" y2="158" stroke="#262c36" stroke-width="1"/>

    <!-- Row 3 -->
    <text x="32" y="184" fill="#e6edf3" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">遮罩 &amp; 分组</text>
    <text x="176" y="184" fill="#8b949e" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">改遮罩重算 / 易丢分组</text>
    <text x="336" y="184" fill="#3fb950" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">完整保留遮罩与组边界</text>
    <line x1="22" y1="196" x2="498" y2="196" stroke="#262c36" stroke-width="1"/>

    <!-- Row 4 -->
    <text x="32" y="222" fill="#e6edf3" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">保留原物体</text>
    <text x="176" y="222" fill="#8b949e" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">仅原地覆盖</text>
    <text x="336" y="222" fill="#3fb950" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">可选留副本或原地替换</text>
    <line x1="22" y1="234" x2="498" y2="234" stroke="#262c36" stroke-width="1"/>

    <!-- Row 5 -->
    <text x="32" y="260" fill="#e6edf3" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">同名子工具</text>
    <text x="176" y="260" fill="#f85149" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">直接报错拒绝运行</text>
    <text x="336" y="260" fill="#3fb950" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">按索引批量，同名无碍</text>
    <line x1="22" y1="272" x2="498" y2="272" stroke="#262c36" stroke-width="1"/>

    <!-- Row 6 -->
    <text x="32" y="298" fill="#e6edf3" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">重拓扑联动</text>
    <text x="176" y="298" fill="#8b949e" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">需手动多步操作</text>
    <text x="336" y="298" fill="#58a6ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold">一键预减面+拓扑+投射</text>
  </g>
</svg>
